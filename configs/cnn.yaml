seed: 42
device: auto
data:
  root: data
  image_size: 64
  batch_size: 256
  num_workers: 2
  augment: true
model:
  name: cnn
  dropout: 0.30
  pretrained: false
training:
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.05
  monitor: macro_f1
  patience: 5
  min_delta: 0.001
output_dir: outputs/cnn

