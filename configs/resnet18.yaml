seed: 42
device: auto
data:
  root: data
  image_size: 64
  batch_size: 128
  num_workers: 2
  augment: true
model:
  name: resnet18
  dropout: 0.20
  pretrained: true
training:
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.05
  monitor: macro_f1
  patience: 4
  min_delta: 0.001
output_dir: outputs/resnet18

